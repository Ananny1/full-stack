<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 via-purple-50 to-pink-50">
  <div class="w-full max-w-lg bg-white/80 backdrop-blur-xl shadow-2xl rounded-2xl p-8 border border-white/30">
    <!-- Header -->
    <div class="mb-8 text-center">
      <h2 class="text-3xl font-extrabold text-gray-800">Create your account</h2>
      <p class="text-gray-500 mt-2">Join us and get started in seconds</p>
    </div>

    <!-- Signup Form -->
    <form [formGroup]="signupForm" (ngSubmit)="onSubmit()" class="space-y-5">
      <!-- First Name -->
      <div>
        <label for="firstName" class="block text-sm font-semibold text-gray-700 mb-1">First Name</label>
        <input
          id="firstName"
          formControlName="firstName"
          type="text"
          placeholder="First Name"
          class="w-full bg-white/70 border border-gray-300 rounded-xl px-4 py-3 focus:ring-4 focus:ring-blue-300 focus:outline-none shadow-sm transition"
        />
        <div *ngIf="firstName?.invalid && firstName?.touched" class="text-red-600 text-sm mt-1">
          First name is required
        </div>
      </div>

      <!-- Last Name -->
      <div>
        <label for="lastName" class="block text-sm font-semibold text-gray-700 mb-1">Last Name</label>
        <input
          id="lastName"
          formControlName="lastName"
          type="text"
          placeholder="Last Name"
          class="w-full bg-white/70 border border-gray-300 rounded-xl px-4 py-3 focus:ring-4 focus:ring-blue-300 focus:outline-none shadow-sm transition"
        />
        <div *ngIf="lastName?.invalid && lastName?.touched" class="text-red-600 text-sm mt-1">
          Last name is required
        </div>
      </div>

      <!-- Email -->
      <div>
        <label for="email" class="block text-sm font-semibold text-gray-700 mb-1">Email address</label>
        <input
          id="email"
          formControlName="email"
          type="email"
          placeholder="Email address"
          class="w-full bg-white/70 border border-gray-300 rounded-xl px-4 py-3 focus:ring-4 focus:ring-blue-300 focus:outline-none shadow-sm transition"
        />
        <div *ngIf="email?.invalid && email?.touched" class="text-red-600 text-sm mt-1">
          Email is required and must be valid
        </div>
      </div>

      <!-- Password -->
      <div>
        <label for="password" class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
        <input
          id="password"
          formControlName="password"
          type="password"
          placeholder="Password"
          class="w-full bg-white/70 border border-gray-300 rounded-xl px-4 py-3 focus:ring-4 focus:ring-blue-300 focus:outline-none shadow-sm transition"
        />
        <div *ngIf="password?.invalid && password?.touched" class="text-red-600 text-sm mt-1">
          Password is required (minimum 6 characters)
        </div>
      </div>

      <!-- Confirm Password -->
      <div>
        <label for="confirmPassword" class="block text-sm font-semibold text-gray-700 mb-1">Confirm Password</label>
        <input
          id="confirmPassword"
          formControlName="confirmPassword"
          type="password"
          placeholder="Confirm Password"
          class="w-full bg-white/70 border border-gray-300 rounded-xl px-4 py-3 focus:ring-4 focus:ring-blue-300 focus:outline-none shadow-sm transition"
        />
        <div *ngIf="confirmPassword?.invalid && confirmPassword?.touched" class="text-red-600 text-sm mt-1">
          Confirm password is required
        </div>
        <div *ngIf="signupForm.errors?.['passwordMismatch'] && confirmPassword?.touched" class="text-red-600 text-sm mt-1">
          Passwords do not match
        </div>
      </div>

      <!-- Global Error -->
      <div *ngIf="error$ | async as error" class="text-red-600 text-center text-sm font-medium">
        {{ error }}
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        [disabled]="signupForm.invalid || (loading$ | async)"
        class="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white font-bold py-3 rounded-xl shadow-lg transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center"
      >
        <span *ngIf="loading$ | async" class="w-5 h-5 mr-2 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
        Sign up
      </button>
    </form>

    <!-- Footer -->
    <div class="mt-6 text-center text-sm text-gray-600">
      <span>Already have an account?</span>
      <a routerLink="/login" class="text-blue-600 font-semibold hover:underline ml-1">Sign in here</a>
    </div>
  </div>
</div>
