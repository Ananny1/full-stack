<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 via-purple-50 to-pink-50">
  <div class="w-full max-w-md bg-white/80 backdrop-blur-xl shadow-2xl rounded-2xl p-8 border border-white/30" data-aos="zoom-in">
    <!-- Header -->
    <div class="mb-8 text-center" data-aos="fade-down">
      <h2 class="text-3xl font-extrabold text-gray-800">Reset Password</h2>
      <p class="text-gray-500 mt-2">Enter your new password below</p>
    </div>

    <!-- Form -->
    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-6" data-aos="fade-up">
      <!-- New Password -->
      <div>
        <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">New Password</label>
        <input 
          id="password"
          type="password"
          formControlName="password"
          placeholder="••••••••"
          class="w-full bg-white/70 border border-gray-300 rounded-xl px-4 py-3 focus:ring-4 focus:ring-blue-300 focus:outline-none transition shadow-sm"
        />
      </div>

      <!-- Confirm Password -->
      <div>
        <label for="confirm" class="block text-sm font-semibold text-gray-700 mb-2">Confirm Password</label>
        <input 
          id="confirm"
          type="password"
          formControlName="confirm"
          placeholder="••••••••"
          class="w-full bg-white/70 border border-gray-300 rounded-xl px-4 py-3 focus:ring-4 focus:ring-purple-300 focus:outline-none transition shadow-sm"
        />
      </div>

      <!-- Message -->
      <div *ngIf="message" class="text-center text-sm font-medium"
           [ngClass]="{'text-green-600': message.toLowerCase().includes('success'), 'text-red-600': message.toLowerCase().includes('invalid')}"
           data-aos="fade-in">
        {{ message }}
      </div>

      <!-- Submit Button -->
      <button 
        type="submit" 
        [disabled]="loading || form.invalid"
        class="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white font-bold py-3 rounded-xl transition-all duration-300 shadow-lg disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center"
        data-aos="fade-up"
      >
        <span *ngIf="loading" class="w-5 h-5 mr-2 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
        Reset Password
      </button>
    </form>

    <!-- Back to Login -->
    <div class="mt-8 text-center text-sm text-gray-600" data-aos="fade-up" data-aos-delay="200">
      <a routerLink="/login" class="text-blue-600 font-semibold hover:underline">Back to login</a>
    </div>
  </div>
</div>
