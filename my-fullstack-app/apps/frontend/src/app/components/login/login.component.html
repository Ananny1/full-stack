<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 via-purple-50 to-pink-50">
  <div class="w-full max-w-md bg-white/80 backdrop-blur-xl shadow-2xl rounded-2xl p-8 border border-white/30">
    <!-- Header -->
    <div class="mb-8 text-center">
      <h2 class="text-3xl font-extrabold text-gray-800">Welcome Back</h2>
      <p class="text-gray-500 mt-2">Log in to continue</p>
    </div>

    <!-- Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <!-- Email -->
      <div>
        <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">Email address</label>
        <input 
          id="email"
          formControlName="email"
          type="email"
          placeholder="you@example.com"
          class="w-full bg-white/70 border border-gray-300 rounded-xl px-4 py-3 focus:ring-4 focus:ring-blue-300 focus:outline-none transition shadow-sm"
        />
        <div *ngIf="email?.invalid && email?.touched" class="text-red-600 text-sm mt-1">
          Email is required and must be valid
        </div>
      </div>

      <!-- Password -->
      <div>
        <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
        <input 
          id="password"
          formControlName="password"
          type="password"
          placeholder="••••••••"
          class="w-full bg-white/70 border border-gray-300 rounded-xl px-4 py-3 focus:ring-4 focus:ring-blue-300 focus:outline-none transition shadow-sm"
        />
        <div *ngIf="password?.invalid && password?.touched" class="text-red-600 text-sm mt-1">
          Password is required (minimum 6 characters)
        </div>

        <!-- ✅ Forgot Password Link -->
        <div class="text-right mt-2">
          <a routerLink="/forgot-password" class="text-sm text-blue-600 hover:underline font-medium">
            Forgot your password?
          </a>
        </div>
      </div>

      <!-- Global Error -->
      <div *ngIf="error$ | async as error" class="text-red-600 text-center text-sm font-medium">
        {{ error }}
      </div>

      <!-- Submit Button -->
      <button 
        type="submit" 
        [disabled]="loginForm.invalid || (loading$ | async)"
        class="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white font-bold py-3 rounded-xl transition-all duration-300 shadow-lg disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center"
      >
        <span *ngIf="loading$ | async" class="w-5 h-5 mr-2 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
        Sign In
      </button>
    </form>

    <!-- Footer -->
    <div class="mt-8 text-center text-sm text-gray-600">
      <span>Don't have an account?</span>
      <a routerLink="/signup" class="text-blue-600 font-semibold hover:underline ml-1">Sign up here</a>
    </div>
  </div>
</div>
